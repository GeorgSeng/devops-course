[supervisord]
nodaemon=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/nginx_stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/nginx_stderr.log
stderr_logfile_maxbytes=0

[program:gateway]
command=/usr/local/bin/gateway
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/gateway_stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/gateway_stderr.log
stderr_logfile_maxbytes=0
