services:
  setup:
    image: alpine:3.21
    command: sh -c "touch -a /app/vstorage"
    volumes:
      - .:/app:z
  service1:
     user: root
     build: ./service1/
     depends_on:
      setup:
        condition: service_completed_successfully
     ports: 
      - "8199:8080"
     volumes:
      - ./:/app/externalData:z
     networks:
      - frontend
      - backend
  service2:
    #image: exercise1/service2
    user: root
    build: 
      context: .
      dockerfile: ./service2/Dockerfile
    depends_on:
      setup:
        condition: service_completed_successfully
    #ports:
    #  - "8080:8080"
    volumes:
      - ./:/deployments/externalData:z
    networks:
      - backend
networks:
  frontend:
    driver: bridge
  backend: